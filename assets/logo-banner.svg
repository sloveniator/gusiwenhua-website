<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 520" width="1650" height="520">
  <defs>
    <radialGradient id="bbg" cx="31%" cy="42%" r="120%">
      <stop offset="0%" stop-color="#1d4566"/>
      <stop offset="45%" stop-color="#10263e"/>
      <stop offset="85%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#050a12"/>
    </radialGradient>
    <radialGradient id="disc" cx="40%" cy="34%" r="90%">
      <stop offset="0%" stop-color="#132c4a"/>
      <stop offset="55%" stop-color="#0e2036"/>
      <stop offset="100%" stop-color="#0a1524"/>
    </radialGradient>
    <linearGradient id="bgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5df8a"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a8842a"/>
    </linearGradient>
    <linearGradient id="tteal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="tcore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fff7d6"/>
      <stop offset="100%" stop-color="#e6c86a"/>
    </radialGradient>
    <linearGradient id="ttitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f0dca0"/>
      <stop offset="100%" stop-color="#f5df8a"/>
    </linearGradient>
    <filter id="tglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1650" height="520" fill="url(#bbg)"/>

  <!-- 顶部细金线与端点 -->
  <line x1="590" y1="52" x2="1620" y2="52" stroke="url(#bgold)" stroke-width="2" opacity="0.45"/>
  <circle cx="1620" cy="52" r="5" fill="url(#bgold)" opacity="0.75"/>

  <!-- ===== 徽章 ===== -->
  <g transform="translate(330,260)">
    <!-- 底盘 -->
    <circle r="208" fill="url(#disc)"/>
    <circle r="207.5" fill="none" stroke="url(#bgold)" stroke-width="9"/>
    <circle r="196" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.35"/>
    <circle r="150" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.25"/>
    <!-- 24 次刻度 -->
    <g stroke="#a8842a" stroke-width="3" opacity="0.7">
      <line x1="0" y1="-194" x2="0" y2="-203" transform="rotate(15)"/>
      <line x1="0" y1="-194" x2="0" y2="-203" transform="rotate(45)"/>
      <line x1="0" y1="-194" x2="0" y2="-203" transform="rotate(75)"/>
      <line x1="0" y1="-194" x2="0" y2="-203" transform="rotate(105)"/>
      <line x1="0" y1="-194" x2="0" y2="-203" transform="rotate(135)"/>
      <line x1="0" y1="-194" x2="0" y2="-203" transform="rotate(165)"/>
      <line x1="0" y1="-194" x2="0" y2="-203" transform="rotate(195)"/>
      <line x1="0" y1="-194" x2="0" y2="-203" transform="rotate(225)"/>
      <line x1="0" y1="-194" x2="0" y2="-203" transform="rotate(255)"/>
      <line x1="0" y1="-194" x2="0" y2="-203" transform="rotate(285)"/>
      <line x1="0" y1="-194" x2="0" y2="-203" transform="rotate(315)"/>
      <line x1="0" y1="-194" x2="0" y2="-203" transform="rotate(345)"/>
    </g>
    <!-- 12 主刻度 -->
    <g stroke="url(#bgold)" stroke-width="6">
      <line x1="0" y1="-188" x2="0" y2="-207"/>
      <line x1="0" y1="-188" x2="0" y2="-207" transform="rotate(30)"/>
      <line x1="0" y1="-188" x2="0" y2="-207" transform="rotate(60)"/>
      <line x1="0" y1="-188" x2="0" y2="-207" transform="rotate(90)"/>
      <line x1="0" y1="-188" x2="0" y2="-207" transform="rotate(120)"/>
      <line x1="0" y1="-188" x2="0" y2="-207" transform="rotate(150)"/>
      <line x1="0" y1="-188" x2="0" y2="-207" transform="rotate(180)"/>
      <line x1="0" y1="-188" x2="0" y2="-207" transform="rotate(210)"/>
      <line x1="0" y1="-188" x2="0" y2="-207" transform="rotate(240)"/>
      <line x1="0" y1="-188" x2="0" y2="-207" transform="rotate(270)"/>
      <line x1="0" y1="-188" x2="0" y2="-207" transform="rotate(300)"/>
      <line x1="0" y1="-188" x2="0" y2="-207" transform="rotate(330)"/>
    </g>
    <!-- 四象菱形 -->
    <g filter="url(#tglow)">
      <polygon points="0,-84 -17,-58 0,-32 17,-58" fill="url(#tteal)"/>
      <polygon points="84,0 58,-17 32,0 58,17" fill="url(#tteal)" opacity="0.92"/>
      <polygon points="0,84 -17,58 0,32 17,58" fill="#0d9488" opacity="0.82"/>
      <polygon points="-84,0 -58,-17 -32,0 -58,17" fill="#0d9488" opacity="0.88"/>
    </g>
    <!-- 中心金核 -->
    <circle r="26" fill="url(#tcore)"/>
    <circle r="9" fill="#0b1626"/>
    <!-- 四角金点 -->
    <g fill="url(#bgold)" opacity="0.9">
      <circle cx="106" cy="-106" r="5"/>
      <circle cx="-106" cy="-106" r="5"/>
      <circle cx="106" cy="106" r="5"/>
      <circle cx="-106" cy="106" r="5"/>
    </g>
  </g>

  <!-- ===== 文字 ===== -->
  <g>
    <!-- 主标题 -->
    <text x="600" y="208" font-family="'Noto Serif SC','Songti SC','SimSun','STSong',serif" font-size="116" font-weight="700" letter-spacing="26" fill="url(#ttitle)">古四信息咨询</text>
    <!-- 英文副标 -->
    <text x="600" y="286" font-family="'Noto Sans SC','Arial','PingFang SC',sans-serif" font-size="34" font-weight="700" letter-spacing="14" fill="url(#bgold)">GU SI INFORMATION CONSULTING</text>
    <!-- 分隔线 -->
    <line x1="600" y1="330" x2="750" y2="330" stroke="url(#bgold)" stroke-width="3" opacity="0.8"/>
    <line x1="758" y1="330" x2="960" y2="330" stroke="url(#bgold)" stroke-width="3" opacity="0.35"/>
    <!-- 三大领域 -->
    <text x="600" y="384" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="600" letter-spacing="10" fill="#2dd4bf">玄学 · 心理 · 财经</text>
    <!-- slogan -->
    <text x="600" y="450" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="25" letter-spacing="8" fill="#94a3b8">洞察万象 · 启迪人生</text>
    <!-- 右下角星芒 -->
    <g stroke="#f5df8a" stroke-width="2" opacity="0.9">
      <line x1="1550" y1="448" x2="1574" y2="448"/>
      <line x1="1562" y1="436" x2="1562" y2="460"/>
    </g>
    <circle cx="1562" cy="448" r="4" fill="#f5df8a"/>
  </g>
</svg>
