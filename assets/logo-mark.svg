<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1d4566"/>
      <stop offset="45%" stop-color="#10263e"/>
      <stop offset="100%" stop-color="#070d18"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5df8a"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a8842a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fff7d6"/>
      <stop offset="100%" stop-color="#e6c86a"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 底盘 -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="30.2" fill="none" stroke="#2dd4bf" stroke-width="0.5" opacity="0.28"/>

  <!-- 罗盘刻度环（24 刻，呼应时辰节气） -->
  <g stroke="url(#gold)" opacity="0.55">
    <line x1="32" y1="3.5" x2="32" y2="6.2" stroke-width="1.6"/>
    <line x1="32" y1="57.8" x2="32" y2="60.5" stroke-width="1.6"/>
    <line x1="3.5" y1="32" x2="6.2" y2="32" stroke-width="1.6"/>
    <line x1="57.8" y1="32" x2="60.5" y2="32" stroke-width="1.6"/>
  </g>
  <g stroke="#c9a227" opacity="0.35" stroke-width="1">
    <line x1="32" y1="8.2" x2="32" y2="10" transform="rotate(30 32 32)"/>
    <line x1="32" y1="8.2" x2="32" y2="10" transform="rotate(60 32 32)"/>
    <line x1="32" y1="8.2" x2="32" y2="10" transform="rotate(120 32 32)"/>
    <line x1="32" y1="8.2" x2="32" y2="10" transform="rotate(150 32 32)"/>
    <line x1="32" y1="8.2" x2="32" y2="10" transform="rotate(210 32 32)"/>
    <line x1="32" y1="8.2" x2="32" y2="10" transform="rotate(240 32 32)"/>
    <line x1="32" y1="8.2" x2="32" y2="10" transform="rotate(300 32 32)"/>
    <line x1="32" y1="8.2" x2="32" y2="10" transform="rotate(330 32 32)"/>
  </g>

  <!-- 外主环 -->
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <circle cx="32" cy="32" r="26.8" fill="none" stroke="#f5df8a" stroke-width="0.4" opacity="0.7"/>

  <!-- 四象菱形（上、下、左、右），青绿渐变 + 光晕 -->
  <g filter="url(#glow)">
    <polygon points="32,15.5 35.2,21.5 32,27.5 28.8,21.5" fill="url(#teal)"/>
    <polygon points="32,36.5 35.2,42.5 32,48.5 28.8,42.5" fill="url(#teal)" opacity="0.85"/>
    <polygon points="15.5,32 21.5,28.8 27.5,32 21.5,35.2" fill="url(#teal)" opacity="0.7"/>
    <polygon points="36.5,32 42.5,28.8 48.5,32 42.5,35.2" fill="url(#teal)" opacity="0.85"/>
  </g>

  <!-- 中心太极原点 -->
  <circle cx="32" cy="32" r="3.4" fill="url(#core)" filter="url(#softGlow)"/>
  <circle cx="32" cy="32" r="1.3" fill="#0b1626"/>

  <!-- 四角星点 -->
  <g fill="url(#gold)" opacity="0.9">
    <circle cx="14" cy="14" r="1.2"/>
    <circle cx="50" cy="14" r="1.2"/>
    <circle cx="14" cy="50" r="1.2"/>
    <circle cx="50" cy="50" r="1.2"/>
  </g>

  <!-- 内细环装饰 -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#2dd4bf" stroke-width="0.5" opacity="0.25"/>
</svg>
