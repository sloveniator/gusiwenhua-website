services:
  backend:
    build: ./backend
    image: gusiwenhua-backend:latest
    container_name: gusiwenhua-backend
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build: .
    image: gusiwenhua-web:latest
    container_name: gusiwenhua-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./acme-webroot:/var/www/acme:ro
    depends_on:
      - backend
    restart: unless-stopped