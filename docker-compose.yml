services:
  backend:
    build: ./backend
    image: gusiwenhua-backend:latest
    container_name: gusiwenhua-backend
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build: .
    image: gusiwenhua-web:latest
    container_name: gusiwenhua-web
    # 仅宿主机本机可访问（Lucky 反代 127.0.0.1:16783 → web），不直接暴露公网
    ports:
      - "127.0.0.1:16783:80"
    depends_on:
      - backend
    restart: unless-stopped